<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="e">
  <!-- The lowercase e is a genuine hole, not a white shape, so the mark reads
       on the light surface and on the night surface without a second colour. -->
  <mask id="e-cut">
    <rect width="100" height="100" fill="#fff"/>
    <g fill="none" stroke="#000" stroke-width="9.5" stroke-linecap="round">
      <path d="M27.5 50H72.5"/>
      <path d="M72.5 50A22.5 22.5 0 1 0 62.9 68.4"/>
    </g>
  </mask>
  <circle cx="50" cy="50" r="46" fill="currentColor" mask="url(#e-cut)"/>
</svg>
